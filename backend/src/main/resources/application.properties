spring.application.name=parcelshare
server.port=${PORT:8090}

# ---- Dev database: file-based H2 in PostgreSQL mode (zero install). Override with env vars for Postgres. ----
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/parcelshare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---- App settings ----
parcelshare.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
parcelshare.commission-percent=10
parcelshare.cancellation-fee-percent=10
parcelshare.release-window-hours=${RELEASE_WINDOW_HOURS:48}
parcelshare.request-expiry-hours=24
parcelshare.rate-limit-per-minute=30
parcelshare.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
parcelshare.cors-origins=${CORS_ORIGINS:http://localhost:5180}
# Dev-only seeded admin. In production set ADMIN_PASSWORD yourself (or leave it empty to skip creating the admin).
parcelshare.admin-email=${ADMIN_EMAIL:admin@parcelshare.local}
parcelshare.admin-password=${ADMIN_PASSWORD:ChangeMe123!}
parcelshare.seed-demo=${SEED_DEMO:false}
parcelshare.demo-mode=${DEMO_MODE:${SEED_DEMO:false}}

# ---- Uploads ----
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# ---- Email (optional). Without SMTP settings, emails are only written to the log. ----
# To send real mail set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true and MAIL_FROM.
parcelshare.mail-from=${MAIL_FROM:}
parcelshare.frontend-url=${FRONTEND_URL:http://localhost:5180}
